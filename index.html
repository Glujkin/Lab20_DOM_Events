<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №20 — DOM и события</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="mainTitle">Лабораторная работа №20</h1>
        <p id="mainParagraph"><strong>Шишкин Тимофей</p>
        <p><strong>Группа:</strong> ИСП-231</p>
        <p>Откройте консоль браузера (F12), чтобы увидеть результаты работы с DOM.</p>

        <!-- Секция для Шага 5: кнопка -->
        <button id="clickButton" class="btn btn-primary">Нажми меня!</button>

        <!-- Секция для Шагов 6-7: форма ввода -->
        <div class="input-section">
            <h2>Введите ваше имя</h2>
            <input type="text" id="nameInput" placeholder="Ваше имя..." class="input-field">
            <button id="greetButton" class="btn btn-success">Приветствовать</button>
            <button id="clearButton" class="btn btn-secondary">Очистить</button>
            <p id="output" class="output-text"></p>
        </div>

        <!-- Секция для Шага 8: HTML-форма -->
        <div class="form-section">
            <h2>Регистрация</h2>
            <form id="registrationForm">
                <div class="form-group">
                    <label for="userName">Имя:</label>
                    <input type="text" id="userName" class="input-field" required>
                </div>
                <div class="form-group">
                    <label for="userAge">Возраст:</label>
                    <input type="number" id="userAge" class="input-field" required>
                </div>
                <div class="form-group">
                    <label for="userEmail">Email:</label>
                    <input type="email" id="userEmail" class="input-field" required>
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </form>
            <p id="formOutput" class="output-text"></p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
